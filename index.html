function setLocale(locale){prefs.locale=locale;localStorage.setItem('speakwell-locale',locale);render()}function setTheme(theme){prefs.theme=theme;document.body.dataset.theme=theme;localStorage.setItem('speakwell-theme',theme);render()}function translateUI(){if(prefs.locale!=='zh')return;let walker=document.createTreeWalker(document.getElementById('app'),NodeFilter.SHOW_TEXT);let nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(let n of nodes){let key=n.nodeValue.trim();if(zhText[key])n.nodeValue=n.nodeValue.replace(key,zhText[key]);else if(/^\d+ exchanges$/.test(key))n.nodeValue=n.nodeValue.replace(key,key.replace(' exchanges',' 轮对话'));else if(/^Level \d/.test(key))n.nodeValue=n.nodeValue.replace(key,key.replace('Level ','难度 '));else if(/^\d+ useful words$/.test(key))n.nodeValue=n.nodeValue.replace(key,'共 '+key.match(/^\d+/)[0]+' 个实用词汇')}let input=document.getElementById('reply');if(input)input.placeholder='输入你的回答…'}
function side(){let sc=scenarios[state.scenario],level=lvl();return `<aside class="panel side"><div class="side-title">Your learning context</div><div><div class="label">CURRENT SCENARIO</div><div class="scene-name">${sc.icon} &nbsp;${sc.name}</div></div><div><div class="label">ADAPTIVE DIFFICULTY</div><div class="level-row"><div class="level">Level ${level.toFixed(1)}</div><div class="level-caption">Intermediate</div></div><div class="track"><span style="width:${level/5*100}%"></span></div></div><div class="rule"></div><div><h4>Practice focus</h4>${sc.focus.map(x=>`<div class="focus-item"><span class="check">✓</span><span>${x}</span></div>`).join('')}</div><div><h4>Today's goal</h4><div class="goal">${sc.goal}</div></div><div class="principle"><strong>Why no corrections yet?</strong>We keep the conversation flowing, then reflect together at the end. This helps you focus on expressing your ideas first.</div></aside>`}
function practice(){let sc=scenarios[state.scenario];return `<main class="page"><div class="eyebrow">A little practice goes a long way</div><h1 class="heading">Make space for your English.</h1><p class="sub">Choose a scenario and build confidence one conversation at a time.</p><div class="scenarios">${Object.entries(scenarios).map(([k,x])=>`<button class="scenario ${state.scenario===k?'selected':''}" onclick="startSession('${k}')"><span class="icon">${x.icon}</span>${x.name}</button>`).join('')}</div><div class="layout"><section class="panel chat"><div class="chat-head"><div class="coach"><div class="avatar">S</div><div>Speaking coach<div class="tiny">A patient partner for your practice</div></div></div><div class="session-count">${state.messages.length>1?state.messages.length-1:0} exchanges</div></div><div class="messages" id="messages">${state.messages.map(m=>`<div class="message ${m.role==='user'?'user':''}"><div class="msg-avatar">${m.role==='user'?'Y':'S'}</div><div class="bubble">${esc(m.text)}</div></div>`).join('')}</div><div class="input-wrap"><div class="input-box"><textarea id="reply" rows="1" placeholder="Write your response..." onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();sendMessage()}"></textarea><button class="mic" title="Voice input coming soon" onclick="showToast('Voice practice is coming soon')">${icons.mic}</button><button class="send" onclick="sendMessage()" aria-label="Send">${icons.send}</button></div><div class="chat-actions"><span class="hint">Take your time. Your coach won’t interrupt to correct you.</span><button class="end" onclick="endSession()">End session&nbsp; ↗</button></div></div></section>${side()}</div></main>`}
const feedbackSeed={score:8.4,strengths:['Clear, easy-to-follow answers','Relevant experience examples','Confident communication'],improvement:'You explained your experience clearly. Next, focus on keeping past tense consistent when describing completed projects.',grammar:[{original:'I lead a redesign project last year.',corrected:'I led a redesign project last year.',why:'“Last year” places the action in the past, so use the past form “led”.'}],vocab:[{original:'I did the user research.',better:'I conducted user research.',why:'“Conducted” is a natural collocation for research in a professional interview.'}],expression:[{original:'I made the app more easy to use.',better:'I made the app easier to use.',why:'“Easier to use” is the more natural comparative phrase in this context.'}],goal:'Next time, describe one project and explain the impact you made, using past tense consistently.',next:3.5,reason:'Your communication was clear and well structured, so the next session can add slightly more complex follow-up questions.'};
function endSession(){if(state.feedback){go('feedback');return}if(state.messages.length<2){showToast('Add a response before ending your session');return}state.feedback={...feedbackSeed,old:lvl(),score:Math.max(6.8,Math.min(9.6,feedbackSeed.score+(state.messages.length-3)*.08)),next:Math.min(5,Math.round((lvl()+.5)*2)/2)};data.sessions.push({score:state.feedback.score,level:state.feedback.next,date:new Date().toISOString().slice(0,10),issue:'Past tense',minutes:8+state.messages.length,scenario:state.scenario});data.level=state.feedback.next;persist();state.page='feedback';render();window.scrollTo({top:0,behavior:'instant'})}
function card(title,color,tag,items){return `<section class="panel feedback-card"><div class="section-title"><span style="color:${color}">●</span>${title}<span class="tag">${tag}</span></div>${items.map(i=>`<div class="item"><div class="item-label">YOU SAID</div><div class="quote">“${esc(i.original)}”</div><div class="item-label" style="margin-top:10px">TRY THIS</div><div class="quote correction">“${esc(i.corrected||i.better)}”</div><div class="why">${esc(i.why)}</div></div>`).join('')}</section>`}
function feedback(){let f=state.feedback||feedbackSeed,old=f.old??lvl();return `<main class="page"><div class="eyebrow">Practice complete · ${scenarios[state.scenario].name}</div><div class="feedback-top"><div><h1 class="heading">A moment to reflect.</h1><p class="sub">You showed up and expressed your ideas. Here’s what stood out.</p></div><div class="score-card"><div class="score">${f.score.toFixed(1)}<small> / 10</small></div><div class="score-label">SESSION SCORE</div></div></div><section class="panel feedback-card" style="margin-top:23px"><div class="section-title">What went well <span class="tag">STRENGTHS</span></div><div class="strengths">${f.strengths.map(x=>`<span class="strength">✓ &nbsp;${esc(x)}</span>`).join('')}</div><div class="improve"><b>Your focus for next time</b><br>${esc(f.improvement)}</div></section><div class="feedback-grid">${card('Grammar','var(--red)','ONE PATTERN',f.grammar)}${card('Vocabulary','var(--amber)','A MORE NATURAL CHOICE',f.vocab)}${card('Natural expression','var(--green)','IN THIS CONTEXT',f.expression)}</div><section class="panel next-panel"><div><h3>Your next practice goal</h3><p>${esc(f.goal)}<br><span style="font-size:11px">${esc(f.reason)}</span></p></div><div class="level-change">${old.toFixed(1)} <span style="color:#9ca2ac">→</span> ${f.next.toFixed(1)} <span style="font-size:11px;color:#7b818c">LEVEL</span></div></section><div class="buttons"><button class="primary" onclick="saveSession()">Practice again&nbsp; →</button><button class="secondary" onclick="go('progress')">View progress</button></div></main>`}
function saveSession(){startSession(state.scenario);window.scrollTo({top:0,behavior:'instant'})}
function chart(){let arr=data.sessions.slice(-7),max=Math.max(10,...arr.map(x=>x.score)),min=5,pts=arr.map((x,i)=>`${30+i*(320/Math.max(1,arr.length-1))},${170-(x.score-min)/(max-min)*135}`).join(' ');return `<div class="chart"><svg viewBox="0 0 380 205" preserveAspectRatio="none"><line x1="25" y1="35" x2="355" y2="35" class="gridline"/><line x1="25" y1="100" x2="355" y2="100" class="gridline"/><line x1="25" y1="170" x2="355" y2="170" class="gridline"/><text x="0" y="39" class="chart-label">10</text><text x="5" y="104" class="chart-label">7.5</text><text x="8" y="174" class="chart-label">5</text><polyline points="${pts}" fill="none" stroke="#4269e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${arr.map((x,i)=>`<circle cx="${30+i*(320/Math.max(1,arr.length-1))}" cy="${170-(x.score-min)/(max-min)*135}" r="4.5" fill="white" stroke="#4269e8" stroke-width="2.5"/>`).join('')}</svg></div>`}
function progress(){let sessions=data.sessions,avg=sessions.reduce((a,x)=>a+x.score,0)/sessions.length,time=sessions.reduce((a,x)=>a+x.minutes,0);return `<main class="page"><div class="eyebrow">Small steps, visible progress</div><h1 class="heading">Your progress.</h1><p class="sub">A look at how your confidence and skills are growing.</p><div class="stats"><div class="panel stat"><div class="stat-num">Level ${lvl().toFixed(1)}</div><div class="stat-label">CURRENT PRACTICE LEVEL</div></div><div class="panel stat"><div class="stat-num">${sessions.length}</div><div class="stat-label">COMPLETED SESSIONS</div></div><div class="panel stat"><div class="stat-num">${Math.round(time)} <span style="font-size:14px;font-weight:500">min</span></div><div class="stat-label">TIME SPENT PRACTICING</div></div></div><div class="progress-grid"><section class="panel chart-panel"><div class="chart-head"><div><div class="chart-title">Recent performance</div><div class="chart-sub">Session scores · last ${Math.min(7,sessions.length)} practices</div></div><span class="tag">AVG ${avg.toFixed(1)} / 10</span></div>${chart()}</section><section class="panel chart-panel"><div class="chart-title">Your learning pattern</div><div class="chart-sub">A simple reflection from recent sessions</div><div style="margin-top:13px"><div class="pattern"><b>Most common focus</b><span>Past tense</span></div><div class="pattern"><b>Getting stronger</b><span>Vocabulary variety ↑</span></div><div class="pattern"><b>Current strength</b><span>Clear communication</span></div></div><div class="recommend"><div class="eyebrow">UP NEXT FOR YOU</div><h3>Job interview · Level ${lvl().toFixed(1)}</h3><p>Describe a project you’re proud of and explain the impact you made.</p><button class="small-btn" onclick="startSession('work')">Start practice&nbsp; →</button></div></section></div><section class="panel settings-card" style="margin-top:18px"><h2>${tr('Practice history','练习历史')}</h2>${data.sessions.slice().reverse().map(x=>`<div class="history-row"><div><b>${tr(scenarios[x.scenario||'work'].name,{'daily':'日常交流','work':'求职面试','travel':'旅行出行'}[x.scenario||'work'])}</b><small>${x.date} · ${x.minutes} ${tr('min','分钟')} · ${tr('Level','难度')} ${x.level.toFixed(1)}</small></div><span class="history-score">${x.score.toFixed(1)}<small> / 10</small></span></div>`).join('')}</section><section class="panel saved-vocab-panel"><div class="saved-vocab-heading"><div><div class="panel-eyebrow">YOUR PERSONAL WORD BANK</div><h2>Words you’ve collected</h2></div><button class="small-btn" onclick="go('photo')">Explore a photo →</button></div>${savedWords.length?savedWords.map(w=>`<div class="saved-vocab-row"><b>${w[0]}</b><span>${w[1]}</span><i>${w[2]}</i></div>`).join(''):'<p class="no-saved-words">Save a word from Photo Learn and it will be waiting here for your next practice.</p>'}</section><div class="buttons"><button class="secondary" onclick="if(confirm('Reset saved practice progress?')){localStorage.removeItem('speakwell-data');data=JSON.parse(JSON.stringify(initial));render()}">Reset demo progress</button></div></main>`}

function photoLearn(){let words=photoState.analyzed?photoSets[photoState.theme]:[];return `<main class="page photo-page"><div class="photo-kicker"><span class="photo-kicker-mark">✦</span> LEARN FROM YOUR WORLD</div><div class="photo-hero"><div><div class="eyebrow">PHOTO VOCABULARY STUDIO</div><h1 class="heading">Your everyday life,<br><span>in another language.</span></h1><p class="sub">Turn a moment you captured into a visual English lesson. Notice it, name it, and practice saying it.</p></div><div class="photo-counter"><span>01</span><i></i><span>02</span><i></i><span>03</span><small>UPLOAD · EXPLORE · SPEAK</small></div></div><div class="photo-workspace"><section class="photo-main"><div class="photo-toolbar"><div><div class="panel-eyebrow">01 / ADD A MOMENT</div><h2>Start with a photo</h2></div><div class="secure-chip">◈ &nbsp; Stays on this device</div></div><div class="photo-drop ${photoState.url?'has-photo':''}" id="dropzone" onclick="if(!photoState.url)document.getElementById('photoFile').click()" ondragover="event.preventDefault();this.classList.add('dragging')" ondragleave="this.classList.remove('dragging')" ondrop="dropPhoto(event)">${photoState.url?`<div class="photo-frame"><img src="${photoState.url}" alt="Your uploaded scene">${photoState.analyzed?words.map((w,i)=>`<button class="photo-label ${photoState.active===i?'label-active':''}" style="max-width:calc(${100-photoLabels[i][2]}% - 6px);left:${photoLabels[i][2]}%;top:${photoLabels[i][3]}%" onclick="event.stopPropagation();selectPhotoWord(${i})"><span>${w[0]}</span><b>${w[1]}</b></button>`).join(''):''}<button class="replace-photo" onclick="event.stopPropagation();document.getElementById('photoFile').click()">↻ Replace photo</button></div>`:`<div class="drop-content"><div class="upload-orbit"><span>↑</span><i>✦</i></div><h3>Drop a photo from your day</h3><p>A café, a street, your kitchen, a station — anything you want to talk about.</p><button class="upload-btn" onclick="event.stopPropagation();document.getElementById('photoFile').click()">Choose a photo <span>↗</span></button><small>JPG, PNG or WEBP · your photo stays in this browser</small></div>`}</div><input id="photoFile" type="file" accept="image/*" hidden onchange="loadPhoto(this.files[0])"><div class="photo-controls"><div class="select-wrap"><label for="photoTheme">SCENE TYPE</label><select id="photoTheme" onchange="photoState.theme=this.value;photoState.analyzed=false;render()"><option value="airport" ${photoState.theme==='airport'?'selected':''}>Travel & airport</option><option value="cafe" ${photoState.theme==='cafe'?'selected':''}>Café & dining</option><option value="street" ${photoState.theme==='street'?'selected':''}>Around the city</option><option value="home" ${photoState.theme==='home'?'selected':''}>Home & kitchen</option></select></div><button class="analyze-btn" ${photoState.url?'':'disabled'} onclick="analyzePhoto()"><span>✧</span> ${photoState.analyzed?'Refresh scene words':'Explore this scene'} <b>→</b></button></div><div class="photo-footnote"><span class="tiny-spark">✦</span> Demo mode · Scene vocabulary is a curated preview. Live image recognition can be connected later.</div></section><aside class="photo-aside"><div class="aside-orb"></div><div class="panel-eyebrow">A DIFFERENT WAY TO LEARN</div><h3>Notice more.<br>Say more.</h3><p>Connect words to things you’ve actually seen. A personal context makes new language easier to remember and easier to use.</p><div class="photo-steps"><div class="photo-step"><div class="step-no">01</div><div><b>Capture</b><span>Choose a real moment</span></div><div class="step-arrow">↗</div></div><div class="photo-step"><div class="step-no">02</div><div><b>Make meaning</b><span>See English + Chinese together</span></div><div class="step-arrow">↗</div></div><div class="photo-step"><div class="step-no">03</div><div><b>Bring it to life</b><span>Practice with a useful phrase</span></div><div class="step-arrow">↗</div></div></div><div class="photo-aside-foot"><span class="live-dot"></span> YOUR PHOTO · YOUR VOCABULARY</div></aside></div>${photoState.analyzed?`<section class="vocab-section"><div class="vocab-heading"><div><div class="panel-eyebrow">02 / WORDS IN CONTEXT</div><h2>What’s in this scene?</h2><p>Tap a phrase to hear it. Save words you want to keep.</p></div><div class="vocab-total"><strong>0${words.length}</strong><span>useful words</span></div></div><div class="vocab-grid">${words.map((w,i)=>`<article id="word-${i}" class="vocab-card ${photoState.active===i?'vocab-selected':''}"><div class="vocab-card-top"><span class="word-index">0${i+1}</span><button class="save-word ${savedWords.some(x=>x[0]===w[0])?'is-saved':''}" onclick="saveWord(${i})" title="Save word">${savedWords.some(x=>x[0]===w[0])?'♥':'♡'}</button></div><h3>${w[0]}</h3><div class="word-cn">${w[1]}</div><div class="vocab-rule"></div><div class="phrase-label">SAY IT IN A SENTENCE</div><div class="phrase">“${w[2]}”</div><div class="phrase-cn">${w[3]}</div><button class="speak-word" onclick="speakPhrase(${i})"><span>◖))</span> Hear it <b>↗</b></button></article>`).join('')}</div><div class="photo-practice"><div class="practice-symbol">✧</div><div><div class="panel-eyebrow">03 / TAKE IT INTO A CONVERSATION</div><h3>Ready to use these words?</h3><p>Practice the scene with your speaking coach. No pressure, just a natural conversation.</p></div><button class="photo-practice-btn" onclick="state.scenario=${photoState.theme==='airport'?'\'travel\'':photoState.theme==='cafe'?'\'daily\'':photoState.theme==='street'?'\'travel\'':'\'daily\''};startSession(state.scenario)">Practice this scene <span>→</span></button></div></section>`:''}</main>`}
function loadPhoto(file){if(!file||!file.type.startsWith('image/'))return;photoState.url=URL.createObjectURL(file);photoState.fileName=file.name;photoState.analyzed=false;photoState.active=-1;render()}
function dropPhoto(e){e.preventDefault();e.currentTarget.classList.remove('dragging');loadPhoto(e.dataTransfer.files[0])}
function analyzePhoto(){if(!photoState.url)return;let btn=document.querySelector('.analyze-btn');btn.classList.add('analyzing');btn.innerHTML='<span>✧</span> Finding useful words…';setTimeout(()=>{photoState.analyzed=true;photoState.active=-1;render();document.querySelector('.vocab-section')?.scrollIntoView({behavior:'smooth',block:'start'})},750)}
function selectPhotoWord(i){photoState.active=i;render();document.getElementById('word-'+i)?.scrollIntoView({behavior:'smooth',block:'center'})}
function saveWord(i){let w=photoSets[photoState.theme][i];if(savedWords.some(x=>x[0]===w[0]))savedWords=savedWords.filter(x=>x[0]!==w[0]);else savedWords.push(w);localStorage.setItem('speakwell-words',JSON.stringify(savedWords));render();showToast(savedWords.some(x=>x[0]===w[0])?'Word saved to your collection':'Word removed from saved words')}
function speakPhrase(i){let w=photoSets[photoState.theme][i];if(!('speechSynthesis'in window)){showToast('Audio playback is not available in this browser');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w[2]);u.lang='en-US';u.rate=.88;speechSynthesis.speak(u)}
function go(page){if(access&&page==='practice'&&state.feedback){startSession(state.scenario);window.scrollTo(0,0);return}state.page=access||page==='help'?page:'login';render();window.scrollTo({top:0,behavior:'instant'})}
function render(){let draft=document.getElementById('reply')?.value;let email=document.getElementById('demoEmail')?.value;let pw=document.getElementById('demoPassword')?.value;document.documentElement.lang=prefs.locale==='zh'?'zh-CN':'en';document.querySelector('meta[name="theme-color"]').content=prefs.theme==='light'?'#f3f5fa':'#0d0f17';let pages={login:login,home:home,profile:profile,help:help,practice:practice,feedback:feedback,photo:photoLearn,progress:progress};document.getElementById('app').innerHTML=`<div class="shell">${header()}${(pages[access||state.page==='help'?state.page:'login']||home)()}</div>`;translateUI();if(draft&&document.getElementById('reply'))document.getElementById('reply').value=draft;if(email&&document.getElementById('demoEmail'))document.getElementById('demoEmail').value=email;if(pw&&document.getElementById('demoPassword'))document.getElementById('demoPassword').value=pw;let box=document.getElementById('messages');if(box)box.scrollTop=box.scrollHeight}
function sendMessage(){let el=document.getElementById('reply');let text=el.value.trim();if(!text)return;el.value='';state.messages.push({role:'user',text});state.turn++;let sc=scenarios[state.scenario],reply=sc.replies[(state.turn-1)%sc.replies.length];state.loading=true;render();let msg=document.querySelector('.chat');msg.classList.add('loading');setTimeout(()=>{state.messages.push({role:'ai',text:reply});state.loading=false;render();document.getElementById('reply')?.focus({preventScroll:true})},550)}

function tr(en,zh){return prefs.locale==='zh'?zh:en}
function login(){return `<main class="entry"><section class="entry-story"><div class="eyebrow">${tr('YOUR PERSONAL ENGLISH STUDIO','你的个人英语练习室')}</div><h1>${tr('A little practice.<br><span>A world of possibility.</span>','每天开口一点，<br><span>世界更近一点。</span>')}</h1><p>${tr('Learn from your everyday world. Practice a conversation, discover new words, and see your progress.','从真实生活中学英语。练习一段对话，发现新的词汇，看见每一次进步。')}</p><div class="entry-art" aria-hidden="true"><div class="logo">${icons.spark}</div><div class="art-chip one">✦ ${tr('Practice · Reflect · Progress','练习 · 反馈 · 成长')}</div><div class="art-chip two">coffee / 咖啡 &nbsp; ☕</div></div></section><section class="panel auth-card"><div class="eyebrow">WELCOME TO SPEAKWELL</div><h2>${tr('Your next chapter starts here.','欢迎来到 Speakwell')}</h2><p>${tr('Enter the demo, or explore freely as a guest.','登录演示体验，或以游客身份自由探索。')}</p><div class="auth-note">${tr('Demo sign-in only. Use a made-up email and a demo password. No real account is created; passwords are never saved or sent.','当前为演示登录。请使用虚构邮箱和演示密码；不会创建真实账号，密码不会保存或发送。')}</div><form class="auth-form" onsubmit="event.preventDefault();demoLogin()"><label>${tr('Demo email','演示邮箱')}<input id="demoEmail" type="email" placeholder="learner@example.com" autocomplete="off" required></label><label>${tr('Demo password','演示密码')}<div class="password-box"><input id="demoPassword" type="password" placeholder="${tr('At least 6 characters','至少 6 个字符')}" minlength="6" autocomplete="off" required><button type="button" onclick="let p=document.getElementById('demoPassword');p.type=p.type==='password'?'text':'password';this.setAttribute('aria-pressed',p.type==='text')" aria-label="${tr('Show or hide password','显示或隐藏密码')}" aria-pressed="false">◉</button></div></label><div class="form-error" id="authError" role="alert"></div><button class="primary" type="submit">${tr('Enter demo','演示登录')} &nbsp; →</button></form><div class="auth-divider">${tr('or start right away','或直接开始')}</div><button class="secondary guest-btn" onclick="enterApp('guest')">${tr('Continue as guest','游客访问')} &nbsp; ↗</button><button class="auth-help" onclick="go('help')">${tr('How does this demo work?','登录与数据说明')}</button><div class="auth-privacy">${tr('No signup needed · Learning data stays in this browser','无需注册 · 学习记录保存在当前浏览器')}</div></section></main>`}
function demoLogin(){let email=document.getElementById('demoEmail'),pw=document.getElementById('demoPassword');if(!email.checkValidity()||pw.value.length<6){document.getElementById('authError').textContent=tr('Enter a valid demo email and at least 6 characters.','请输入有效格式的演示邮箱和至少 6 位演示密码。');return}let name=email.value.split('@')[0].slice(0,24);pw.value='';enterApp('demo',name)}
function enterApp(kind,name){access={kind,name:name||tr('Guest learner','游客学习者')};sessionStorage.setItem('speakwell-access',JSON.stringify(access));state.page='home';render();window.scrollTo(0,0)}
function logout(){sessionStorage.removeItem('speakwell-access');access=null;state.page='login';state.feedback=null;state.turn=0;state.messages=[{role:'ai',text:scenarios[state.scenario].greeting}];render();window.scrollTo(0,0)}
function home(){let recent=data.sessions.slice(-3).reverse();return `<main class="page"><section class="home-hero"><div class="eyebrow">${tr('A LITTLE EVERY DAY','每天一点，持续积累')}</div><h1 class="heading">${tr('Welcome,','你好，')}${access.kind==='guest'?tr('learner.','学习者。'):esc(access.name)+'。'}</h1><p class="sub">${tr('Make time for a '+dailyGoal+'-minute practice. What would you like to explore today?','为自己留出 '+dailyGoal+' 分钟。今天想从哪里开始？')}</p><div class="buttons"><button class="primary" onclick="startSession('work');window.scrollTo(0,0)">${tr('Start a conversation','开始对话练习')} →</button><button class="secondary" onclick="go('profile')">${tr('My learning plan','我的学习计划')}</button></div></section><div class="home-grid"><section class="panel home-card"><div class="home-symbol">☏</div><h2>${tr('Practice with context','在场景中开口')}</h2><p>${tr('Daily life, interviews and travel. Express your ideas, then reflect with your coach.','日常交流、求职面试、旅行出行。先表达想法，再和教练一起复盘。')}</p><button class="small-btn" onclick="go('practice')">${tr('Choose a scenario','选择练习场景')} →</button></section><section class="panel home-card"><div class="home-symbol">▧</div><h2>${tr('Learn from a photo','从照片中学词')}</h2><p>${tr('Turn an everyday moment into bilingual words and useful phrases.','上传生活照片，通过中英词汇与实用例句，把观察变成表达。')}</p><button class="small-btn" onclick="go('photo')">${tr('Explore Photo Learn','打开图片学词')} →</button></section><section class="panel home-card"><div class="home-symbol">↗</div><h2>${tr('See your progress','看见你的进步')}</h2><p>${tr('Review session scores, your learning focus, and words you have saved.','查看练习得分、学习重点，以及你收藏的场景词汇。')}</p><button class="small-btn" onclick="go('progress')">${tr('View my progress','查看学习进度')} →</button></section></div><section class="panel settings-card"><div class="chart-head"><h2>${tr('Recent practice','最近的练习')}</h2><button class="small-btn" onclick="go('progress')">${tr('View all','查看全部')} →</button></div>${recent.map(x=>`<div class="history-row"><div><b>${tr(scenarios[x.scenario||'work'].name,{'daily':'日常交流','work':'求职面试','travel':'旅行出行'}[x.scenario||'work'])}</b><small>${x.date} · ${x.minutes} ${tr('min','分钟')} · ${tr('Level','难度')} ${x.level.toFixed(1)}</small></div><span class="history-score">${x.score.toFixed(1)}<small> / 10</small></span></div>`).join('')}<p>${tr('The initial four sessions are sample records. New demo sessions are saved on this device.','最初四次为示例记录；新完成的演示练习会保存到当前设备。')}</p></section><p class="app-info">${tr('Demo experience · Curated AI responses and vocabulary','演示体验 · 对话、反馈和词汇为预设内容')}</p></main>`}
function profile(){return `<main class="page"><div class="eyebrow">${tr('YOUR LEARNING SPACE','你的学习空间')}</div><h1 class="heading">${tr('Profile & preferences','个人与偏好设置')}</h1><section class="panel profile-summary"><div class="avatar">${access.kind==='guest'?'◉':esc(access.name.slice(0,1).toUpperCase())}</div><div><h2>${access.kind==='guest'?tr('Guest learner','游客学习者'):esc(access.name)}</h2><p>${access.kind==='guest'?tr('Guest access · All demo features available','游客访问 · 可体验所有演示功能'):tr('Demo sign-in · Local experience','演示登录 · 本地体验')}</p></div></section><div class="settings-grid"><section class="panel settings-card"><h2>${tr('Learning preferences','学习偏好')}</h2><div class="setting-row"><div><b>${tr('Daily practice goal','每日练习目标')}</b><small>${tr('A planning preference, not a timer','用于学习计划，不会自动计时')}</small></div><select aria-label="${tr('Daily practice goal','每日练习目标')}" onchange="dailyGoal=Number(this.value);localStorage.setItem('speakwell-goal',dailyGoal)">${[5,10,15,20].map(n=>`<option value="${n}" ${dailyGoal===n?'selected':''}>${n} ${tr('min','分钟')}</option>`).join('')}</select></div><div class="setting-row"><b>${tr('Interface language','界面语言')}</b><select aria-label="${tr('Interface language','界面语言')}" onchange="setLocale(this.value)"><option value="zh" ${prefs.locale==='zh'?'selected':''}>简体中文</option><option value="en" ${prefs.locale==='en'?'selected':''}>English</option></select></div><div class="setting-row"><b>${tr('Appearance','外观')}</b><select aria-label="${tr('Appearance','外观')}" onchange="setTheme(this.value)"><option value="dark" ${prefs.theme==='dark'?'selected':''}>${tr('Dark','深色模式')}</option><option value="light" ${prefs.theme==='light'?'selected':''}>${tr('Light','浅色模式')}</option></select></div></section><section class="panel settings-card"><h2>${tr('About this experience','关于这个学习体验')}</h2><p>${tr('Speakwell explores scenario practice, delayed feedback and contextual vocabulary learning. This portfolio demo uses curated replies and scores; uploaded photos are not recognized by live AI.','Speakwell 探索场景化练习、延迟反馈和情境词汇学习。当前作品集 Demo 使用预设回复与评分，尚未接入真实图片识别。')}</p><p>${tr('Records stay in this browser and are shared between guest and demo access. There is no cloud account or cross-device sync.','练习记录保存在当前浏览器，游客与演示登录共享本地记录；没有云端账号或跨设备同步。')}</p><button class="secondary" onclick="go('help')">${tr('Login & data guide','登录与数据说明')} →</button></section></div><div class="buttons"><button class="secondary" onclick="go('home')">${tr('Back to home','返回首页')}</button><button class="secondary danger" onclick="logout()">${tr('Sign out','退出当前体验')}</button></div><p class="app-info">Speakwell · Portfolio Demo 1.1</p></main>`}
function help(){return `<main class="page"><section class="panel settings-card"><div class="eyebrow">SPEAKWELL GUIDE</div><h1 class="heading">${tr('Start freely. Learn at your pace.','自由开始，按自己的节奏学习。')}</h1><h2>${tr('Guest access','游客访问')}</h2><p>${tr('No email or password needed. All practice, photo vocabulary and progress pages are available.','无需邮箱和密码，可体验所有对话练习、图片学词和学习进度页面。')}</p><h2>${tr('Demo sign-in','演示登录')}</h2><p>${tr('Use a made-up email and a password of at least 6 characters. This only changes the display name; no account, verification, password recovery or real authentication is provided. Passwords are never stored or transmitted.','填写虚构邮箱与至少 6 位演示密码，仅用于展示登录流程和称呼；不会创建账号，也不提供验证、找回密码或真实身份认证。密码不会存储或发送。')}</p><h2>${tr('Your data','你的数据')}</h2><p>${tr('Learning records, saved words and preferences stay in localStorage. Access lasts for this browser tab session. Uploaded photos stay in memory. Clearing browser data removes local records.','学习记录、收藏词汇与偏好保存在浏览器 localStorage 中；访问状态保留在当前标签页会话。上传照片仅保留在页面内存。清除浏览器数据会移除本地记录。')}</p><div class="buttons"><button class="primary" onclick="go(access?'profile':'login')">${tr('Back','返回')}</button>${!access?`<button class="secondary" onclick="enterApp('guest')">${tr('Continue as guest','游客访问')}</button>`:''}</div></section></main>`}

state.messages=[{role:'ai',text:scenarios.work.greeting}];render();
</script></body></html>
